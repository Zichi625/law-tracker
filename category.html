<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多角人才勞動法規追蹤 - 分類</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="category">
  <main class="container">
    <header>
      <nav id="breadcrumb" class="breadcrumb" aria-label="導覽路徑"></nav>
      <h1 id="category-title"></h1>
    </header>

    <div id="identity-bar"></div>

    <div class="content-column">
      <div id="category-notfound" class="status-message" hidden>找不到這個分類</div>

      <input id="search-input" class="search-input" type="search" placeholder="在這個分類內搜尋關鍵字">

      <section class="section category-section">
        <div id="category-body"></div>
        <p id="category-empty-message" class="empty-message" hidden>這個分類尚未有資料</p>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>

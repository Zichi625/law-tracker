<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多角人才勞動法規指南</title>
  <link rel="stylesheet" href="style.css">
  <script src="guide-data.js"></script>
</head>
<body data-page="overview">
  <main class="container">
    <header>
      <div class="hero-banner">
        <img src="images/hero-banner.jpg" alt="多角人才勞動法規指南：從你的工作情境出發，了解規定與下一步" class="hero-banner-img">
      </div>
      <h1 class="site-title">多角人才勞動法規指南</h1>
      <p class="site-tagline">從你的工作情境出發，了解規定與下一步。</p>
      <p id="last-refreshed" class="last-refreshed"></p>
    </header>

    <div id="identity-bar"></div>

    <section class="section search-section">
      <input id="scenario-search-input" class="search-input" type="search" placeholder="描述你遇到的問題，例如「公司要求我加班」">
      <div id="scenario-search-results" class="scenario-search-results" hidden></div>
    </section>

    <section class="section hot-guides-section">
      <h2 class="section-title">熱門情境</h2>
      <div id="hot-guides" class="hot-guides-grid"></div>
    </section>

    <section class="section scenario-nav-section">
      <h2 class="section-title">其他常見情境</h2>
      <div id="scenario-nav" class="scenario-nav"></div>
    </section>

    <nav id="category-nav" class="category-nav"></nav>

    <div class="content-column">
      <input id="search-input" class="search-input" type="search" placeholder="搜尋關鍵字（例如：罰則、資遣費、加班費）">

      <section class="section latest-section">
        <h2 class="section-title">最新法規更新</h2>
        <div id="latest-body"></div>
        <p id="latest-empty-message" class="empty-message" hidden>尚未有資料，請先執行刷新</p>
        <div id="latest-pagination" class="pagination"></div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>

          "text": "只要對方的言語或肢體行為讓人感到被冒犯、不受尊重，帶有性意味或性別歧視的性質，都可能構成職場性騷擾，而且範圍不限於上班時間、辦公室內——2024年3月上路的性平三法修正後，連下班聚餐、私下訊息等場合發生的相關事件，也一併納入保護。更重要的是，公司不用等到員工正式提出申訴書，只要主管或人資「知悉」有疑似情事，法律上就已經有主動介入處理的義務。（相關法規：性別平等工作法（2024年3月8日修正施行））"
        }
      },
      {
        "@type": "Question",
        "name": "公司規模小，也要有性騷擾申訴管道嗎？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "員工人數落在10到29人之間的公司，法律上就要求備有申訴管道讓員工可以反映；一旦達到30人以上，還得再進一步把完整的防治、申訴與懲處規定寫成正式辦法並公告周知，不能只是私下處理了事。（相關法規：性別平等工作法）"
        }
      },
      {
        "@type": "Question",
        "name": "如果性騷擾加害人是公司老闆或董事，員工還要走公司內部申訴流程嗎？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "這次修法對雇主最實際的影響是：認定「誰算最高負責人」的範圍變大了。過去公司只要抗辯「涉案的人不是登記在案的代表人」，就有機會讓裁罰撤銷——確實曾有董事性騷擾員工、卻因為董事身分不算法律上的最高負責人而翻案的真實案例。2026年4月8日勞動部修正性別平等工作法施行細則後，不只是登記負責人本人，連公司的董監事、持有兩成以上股份的大股東、負責人的另一半與近親，以及實際握有人事財務主導權的人，只要涉及性騷擾，都會被比照最高負責人處理；也就是說被害人一樣可以跳過公司內部程序、直接向地方政府申訴，成立後最高可罰新臺幣100萬元。（相關法規：性別平等工作法施行細則第4條之2、第4條之3）"
        }
      },
      {
        "@type": "Question",
        "name": "公司想直接用「特休津貼」的方式，年度中就先把特休折現給員工，不用讓他們真的排假，這樣可以嗎？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "不可以。法律容許把沒休完的特休折算成錢，但僅限兩個時間點：特休年度結束時，或勞動契約結束（例如離職）當下。特休原本存在的用意，是讓員工真的放下工作去休息，不是用現金取代假期。所以就算公司和員工在年度中途都點頭同意「乾脆直接領錢、不用排假」，法院也會認為這種做法架空了特休制度該有的功能，屬於違反強制規定，這樣的約定不生效力。（相關法規：特別休假制度精神與實務函釋見解（勞動基準法第79條是違反特休相關規定時的罰則依據，並非規範預先買斷本身的實體條文））"
        }
      },
      {
        "@type": "Question",
        "name": "員工要休哪一天特休，是員工自己決定，還是公司可以指定？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "答案是：原則上員工自己決定。最高行政法院審理過長榮航空的案子──空服員申請除夕、初二特休，公司以「過年人力需求」駁回，官司一路打到最高行政法院。法院認為，公司若要擋下員工排定的特休日期，必須同時做到兩件事：一是能具體說明企業經營確實面臨迫在眉睫的困難，二是已經實際找員工協商過調整方案；只靠「人手不夠」這種空泛說法站不住腳。同時法院也提醒，員工如果臨時才提出申請，也可能被認為濫用權利，因此建議公司在請假辦法裡先訂好合理的申請提前天數。（相關法規：勞動基準法第38條第2項）"
        }
      },
      {
        "@type": "Question",
        "name": "基本工資調漲後，是不是只有領基本工資的員工才需要調薪，其他員工不受影響？",

          "@type": "Answer",
          "text": "基本工資調整只是設下一個法定最低門檻——公司裡所有員工，不論是月薪、時薪、工讀生或部分工時人員，實際領到的薪資都不能低於這個數字；但如果員工原本的薪水已經高過調整後的新標準，法律並沒有強制公司要再往上加碼。每次基本工資調整後，人資要做的是重新核對現有薪資名單，把低於新門檻的人一一補足差額；同時別忘了勞保、健保、勞退這些以基本工資或投保薪資為基礎的月提繳級距，通常也會跟著同步異動，最好一起檢查是否需要更新。（相關法規：最低工資法（2024年起）；2024年以前基本工資數額由勞動部基本工資審議委員會核定）"
        }
      },
      {
        "@type": "Question",

        "acceptedAnswer": {
          "@type": "Answer",
          "text": "違反基本工資規定的罰則，2024年1月1日這天出現分水嶺。過去依勞動基準法第79條，裁罰封頂在新臺幣100萬元；《最低工資法》施行後，主管機關握有更大的加重權限——同樣是先落在2萬元到100萬元的基本範圍，但可以再依公司規模、違規人數、情節輕重往上疊加，最終上限拉高到新臺幣150萬元，等於比舊制多出50萬元的空間。這個新法生效日，剛好和2024年基本工資調整為月薪27,470元、時薪183元同一天，如果人資腦中還停留在「最重罰100萬」的舊觀念，得特別留意這個變化。（相關法規：最低工資法）"
        }

        "@type": "Question",
